name: Scheduled Keep-Alive

on:
  schedule:
    # S'exécute à 12:00, le lundi (1) et le jeudi (4)
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # Permet de le lancer manuellement pour tester

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      # 1. Réveil de Supabase (La priorité)
      - name: Ping Supabase Database
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      # 2. Ping Cloudinary (Pour la forme)
      - name: Ping Cloudinary API
        run: |
          curl -u "${{ secrets.CLOUDINARY_API_KEY }}:${{ secrets.CLOUDINARY_API_SECRET }}" \
          "https://api.cloudinary.com/v1_1/${{ secrets.CLOUDINARY_CLOUD_NAME }}/usage"
